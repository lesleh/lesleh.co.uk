<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 412" width="100%" role="img" aria-label="The path of a request, from top to bottom. The router is HTTP only. CloudFront passes hostname and myip, with caching off. API Gateway is HTTPS only. Then Lambda, then Route53." fill="none" stroke="var(--illo-ink, #3b0d1a)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:2rem auto;padding:3%;box-sizing:border-box;border-radius:12px;background:var(--illo-paper, #fbf1e4);max-width:30rem">
<rect x="16" y="16" width="200" height="44" rx="12" fill="var(--illo-blue, #8fd0f0)"/>
  <path d="M222 38H236" stroke-width="1.5"/>
  <rect x="16" y="100" width="200" height="44" rx="12" fill="var(--illo-surface, #fff)"/>
  <path d="M222 122H236" stroke-width="1.5"/>
  <rect x="16" y="184" width="200" height="44" rx="12" fill="var(--illo-shade, #ead9c4)"/>
  <path d="M222 206H236" stroke-width="1.5"/>
  <rect x="16" y="268" width="200" height="44" rx="12" fill="var(--illo-gold, #ffd166)"/>
  <rect x="16" y="352" width="200" height="44" rx="12" fill="var(--illo-pink, #f4a3b5)"/>
  <path d="M116 64V96M109 88l7 8 7-8"/>
  <path d="M116 148V180M109 172l7 8 7-8"/>
  <path d="M116 232V264M109 256l7 8 7-8"/>
  <path d="M116 316V348M109 340l7 8 7-8"/>
  <g fill="var(--illo-ink, #3b0d1a)" stroke="none" font-size="16">
    <text x="116" y="44" font-weight="700" text-anchor="middle">Router</text>
    <text x="244" y="44">HTTP only</text>
    <text x="116" y="128" font-weight="700" text-anchor="middle">CloudFront</text>
    <text x="244" y="117">passes hostname and myip</text>
    <text x="244" y="139">caching off</text>
    <text x="116" y="212" font-weight="700" text-anchor="middle">API Gateway</text>
    <text x="244" y="212">HTTPS only</text>
    <text x="116" y="296" font-weight="700" text-anchor="middle">Lambda</text>
    <text x="116" y="380" font-weight="700" text-anchor="middle">Route53</text>
  </g>
</svg>
