    <circle cx="400" cy="97" r="3"/>
    <circle cx="526" cy="97" r="3"/>
    <circle cx="400" cy="164" r="3"/>
    <circle cx="526" cy="164" r="3"/>
  </g>
  <rect x="432" y="114" width="38" height="38" rx="3" fill="var(--illo-surface, #fff)"/>
  <g fill="var(--illo-shade-strong, #d9c3a8)">
    <rect x="518" y="110" width="28" height="18" rx="2"/>
    <rect x="518" y="136" width="28" height="18" rx="2"/>
  </g>
  <g fill="var(--illo-ink, #3b0d1a)" stroke="none"><circle cx="420" cy="97" r="1.5"/><circle cx="430" cy="97" r="1.5"/><circle cx="440" cy="97" r="1.5"/><circle cx="450" cy="97" r="1.5"/><circle cx="460" cy="97" r="1.5"/><circle cx="470" cy="97" r="1.5"/><circle cx="480" cy="97" r="1.5"/><circle cx="490" cy="97" r="1.5"/><circle cx="500" cy="97" r="1.5"/></g>
  <g transform="rotate(-3 422 40)"><rect x="384" y="22" width="76" height="36" rx="6" fill="var(--illo-surface, #fff)"/></g>
  <g transform="rotate(2 512 40)"><rect x="474" y="22" width="76" height="36" rx="6" fill="var(--illo-surface, #fff)"/></g>
  <path d="M512 62V82" stroke-width="1.5"/>
