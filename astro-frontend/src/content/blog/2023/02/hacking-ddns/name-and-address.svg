<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 250" width="100%" role="img" aria-label="A name tag reading home.lesleh.co.uk points at a Raspberry Pi. The name stays the same. Above the Raspberry Pi, a card reading 'old IP' is crossed out, next to a card reading 'new IP'. The IP changes." fill="none" stroke="var(--illo-ink, #3b0d1a)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:2rem auto;padding:3%;box-sizing:border-box;border-radius:12px;background:var(--illo-paper, #fbf1e4)">
<g transform="rotate(-2 116 120)">
    <rect x="16" y="96" width="204" height="48" rx="8" fill="var(--illo-pink, #f4a3b5)"/>
    <circle cx="33" cy="120" r="4" fill="var(--illo-surface, #fff)" stroke-width="1.5"/>
  </g>
  <path d="M236 120H368M360 112l8 8-8 8"/>
  <rect x="388" y="84" width="150" height="92" rx="8" fill="var(--illo-blue, #8fd0f0)"/>
