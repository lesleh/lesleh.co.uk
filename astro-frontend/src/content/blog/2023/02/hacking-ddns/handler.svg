<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 344" width="100%" role="img" aria-label="How the function handles a request. It takes myip from the router and reads the current A record. Same IP? If yes, it does nothing and replies 'No change required'. If no, it does an UPSERT of the A record and replies 'Record updated'." fill="none" stroke="var(--illo-ink, #3b0d1a)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:2rem auto;padding:3%;box-sizing:border-box;border-radius:12px;background:var(--illo-paper, #fbf1e4);max-width:30rem">
<rect x="90" y="16" width="300" height="48" rx="12" fill="var(--illo-blue, #8fd0f0)"/>
  <path d="M240 68V90M233 82l7 8 7-8"/>
  <rect x="90" y="94" width="300" height="48" rx="12" fill="var(--illo-gold, #ffd166)"/>
  <path d="M240 146V168M233 160l7 8 7-8"/>
  <rect x="150" y="172" width="180" height="48" rx="24" fill="var(--illo-surface, #fff)"/>
  <path d="M150 196H121V252M114 244l7 8 7-8"/>
  <path d="M330 196H359V252M352 244l7 8 7-8"/>
  <rect x="16" y="256" width="210" height="72" rx="12" fill="var(--illo-shade, #ead9c4)"/>
  <rect x="254" y="256" width="210" height="72" rx="12" fill="var(--illo-pink, #f4a3b5)"/>
  <g fill="var(--illo-ink, #3b0d1a)" stroke="none" text-anchor="middle" font-size="16">
    <text x="240" y="46" font-size="17">myip from the router</text>
    <text x="240" y="124" font-size="17">Read the current A record</text>
    <text x="240" y="202" font-size="17" font-weight="700">Same IP?</text>
    <text x="134" y="186">yes</text>
    <text x="346" y="186">no</text>
    <text x="121" y="287" font-weight="700">Do nothing</text>
    <text x="121" y="311">“No change required”</text>
    <text x="359" y="287" font-weight="700">UPSERT the A record</text>
    <text x="359" y="311">“Record updated”</text>
  </g>
</svg>
