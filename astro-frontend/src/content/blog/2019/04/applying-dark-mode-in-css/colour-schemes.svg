<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 294" width="100%" role="img" aria-label="Same names, new values. A light page and a dark page, with the value of each custom property under them. --color-background is #fff in light and #222 in dark. --color-text is #222 in light and #fff in dark. --color-primary is #af1440 in both." fill="none" stroke="var(--illo-ink, #3b0d1a)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:2rem auto;padding:3%;box-sizing:border-box;border-radius:12px;background:var(--illo-paper, #fbf1e4)">
<rect x="236" y="16" width="140" height="96" rx="6" fill="var(--illo-fixed-white, #fff)"/>
  <g stroke="none"><rect x="248" y="28" width="70" height="10" rx="3" fill="var(--illo-fixed-crimson, #af1440)"/><rect x="248" y="46" width="116" height="5" rx="2.5" fill="var(--illo-fixed-night, #222)"/><rect x="248" y="58" width="116" height="5" rx="2.5" fill="var(--illo-fixed-night, #222)"/><rect x="248" y="70" width="116" height="5" rx="2.5" fill="var(--illo-fixed-night, #222)"/><rect x="248" y="82" width="116" height="5" rx="2.5" fill="var(--illo-fixed-night, #222)"/><rect x="248" y="94" width="69.6" height="5" rx="2.5" fill="var(--illo-fixed-night, #222)"/></g>
  <rect x="396" y="16" width="140" height="96" rx="6" fill="var(--illo-fixed-night, #222)"/>
  <g stroke="none"><rect x="408" y="28" width="70" height="10" rx="3" fill="var(--illo-fixed-crimson, #af1440)"/><rect x="408" y="46" width="116" height="5" rx="2.5" fill="var(--illo-fixed-white, #fff)"/><rect x="408" y="58" width="116" height="5" rx="2.5" fill="var(--illo-fixed-white, #fff)"/><rect x="408" y="70" width="116" height="5" rx="2.5" fill="var(--illo-fixed-white, #fff)"/><rect x="408" y="82" width="116" height="5" rx="2.5" fill="var(--illo-fixed-white, #fff)"/><rect x="408" y="94" width="69.6" height="5" rx="2.5" fill="var(--illo-fixed-white, #fff)"/></g>
  <path d="M16 152H544" stroke-width="1.5" stroke-opacity=".5"/>
  <rect x="236" y="163" width="28" height="28" rx="6" fill="var(--illo-fixed-white, #fff)"/><rect x="396" y="163" width="28" height="28" rx="6" fill="var(--illo-fixed-night, #222)"/>
  <rect x="236" y="207" width="28" height="28" rx="6" fill="var(--illo-fixed-night, #222)"/><rect x="396" y="207" width="28" height="28" rx="6" fill="var(--illo-fixed-white, #fff)"/>
  <rect x="236" y="251" width="28" height="28" rx="6" fill="var(--illo-fixed-crimson, #af1440)"/><rect x="396" y="251" width="28" height="28" rx="6" fill="var(--illo-fixed-crimson, #af1440)"/>
  <g fill="var(--illo-ink, #3b0d1a)" stroke="none" font-size="18">
    <text x="16" y="60" font-weight="700">Same names,</text>
    <text x="16" y="84">new values.</text>
    <text x="306" y="138" font-weight="700" text-anchor="middle">light</text>
    <text x="466" y="138" font-weight="700" text-anchor="middle">dark</text>
    <text x="16" y="184">--color-background</text><text x="274" y="184">#fff</text><text x="434" y="184">#222</text>
    <text x="16" y="228">--color-text</text><text x="274" y="228">#222</text><text x="434" y="228">#fff</text>
    <text x="16" y="272">--color-primary</text><text x="274" y="272">#af1440</text><text x="434" y="272">#af1440</text>
  </g>
</svg>
