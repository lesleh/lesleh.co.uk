<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 264" width="100%" role="img" aria-label="Three rows, each with an arrow to a page. Safari 12.1, on macOS, shows the dark page. Firefox 67, beta, on macOS, shows the dark page. No support falls back to light, and shows the light page." fill="none" stroke="var(--illo-ink, #3b0d1a)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:2rem auto;padding:3%;box-sizing:border-box;border-radius:12px;background:var(--illo-paper, #fbf1e4);max-width:30rem">
