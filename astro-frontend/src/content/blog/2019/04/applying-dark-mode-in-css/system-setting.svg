<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 250" width="100%" role="img" aria-label="A system setting with two choices, Light and Dark. Dark is selected. Below it are two systems that have the setting: macOS Mojave, 2018, and Windows 10, October 2018." fill="none" stroke="var(--illo-ink, #3b0d1a)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:2rem auto;padding:3%;box-sizing:border-box;border-radius:12px;background:var(--illo-paper, #fbf1e4)">
<g transform="rotate(-0.6 260 83)">
    <rect x="120" y="16" width="280" height="134" rx="10" fill="var(--illo-surface, #fff)"/>
    <rect x="140" y="32" width="110" height="70" rx="6" fill="var(--illo-fixed-white, #fff)"/>
  <g stroke="none"><rect x="152" y="44" width="55" height="10" rx="3" fill="var(--illo-fixed-crimson, #af1440)"/><rect x="152" y="62" width="86" height="5" rx="2.5" fill="var(--illo-fixed-night, #222)"/><rect x="152" y="74" width="86" height="5" rx="2.5" fill="var(--illo-fixed-night, #222)"/><rect x="152" y="86" width="51.6" height="5" rx="2.5" fill="var(--illo-fixed-night, #222)"/></g>
    <rect x="270" y="32" width="110" height="70" rx="6" fill="var(--illo-fixed-night, #222)"/>
  <g stroke="none"><rect x="282" y="44" width="55" height="10" rx="3" fill="var(--illo-fixed-crimson, #af1440)"/><rect x="282" y="62" width="86" height="5" rx="2.5" fill="var(--illo-fixed-white, #fff)"/><rect x="282" y="74" width="86" height="5" rx="2.5" fill="var(--illo-fixed-white, #fff)"/><rect x="282" y="86" width="51.6" height="5" rx="2.5" fill="var(--illo-fixed-white, #fff)"/></g>
    <rect x="263" y="25" width="124" height="84" rx="11" stroke="var(--illo-accent, #af1440)" stroke-width="3"/>
    <g fill="var(--illo-ink, #3b0d1a)" stroke="none" text-anchor="middle" font-size="17">
      <text x="195" y="134">Light</text>
      <text x="325" y="134" font-weight="700">Dark</text>
    </g>
  </g>
  <rect x="60" y="178" width="190" height="56" rx="12" fill="var(--illo-shade, #ead9c4)"/>
  <rect x="270" y="178" width="190" height="56" rx="12" fill="var(--illo-shade, #ead9c4)"/>
  <g fill="var(--illo-ink, #3b0d1a)" stroke="none" text-anchor="middle" font-size="17">
    <text x="155" y="201" font-weight="700">macOS Mojave</text>
    <text x="155" y="223">2018</text>
    <text x="365" y="201" font-weight="700">Windows 10</text>
    <text x="365" y="223">October 2018</text>
  </g>
</svg>
