<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 262" width="100%" role="img" aria-label="Two calendar pages. On the first, December 24, Christmas Eve, the date is crossed out. An arrow points to the second: any Friday, her birthday. Underneath: same heist, same reunion. PRO's own test now fails." fill="none" stroke="var(--illo-ink, #3b0d1a)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:2rem auto;padding:3%;box-sizing:border-box;border-radius:12px;background:var(--illo-paper, #fbf1e4);max-width:34rem">
<g transform="rotate(-2 124 100)">
    <rect x="24" y="24" width="200" height="156" rx="10" fill="var(--illo-surface, #fff)"/>
    <path d="M24 62V34q0-10 10-10h180q10 0 10 10v28Z" fill="var(--illo-shade-strong, #d9c3a8)"/>
    <path d="M46 14v18M202 14v18" stroke-width="4"/>
    <g fill="var(--illo-ink, #3b0d1a)" stroke="none" text-anchor="middle">
      <text x="124" y="51" font-size="18" font-weight="700" letter-spacing="2">DECEMBER</text>
      <text x="124" y="118" font-size="44" font-weight="700">24</text>
      <text x="124" y="156" font-size="19">Christmas Eve</text>
    </g>
  </g>
  <path d="M76 136L172 80" stroke="var(--illo-accent, #af1440)" stroke-width="5"/>
  <path d="M246 102H312M300 90l12 12-12 12"/>
  <g transform="rotate(1.5 436 100)">
    <rect x="336" y="24" width="200" height="156" rx="10" fill="var(--illo-surface, #fff)"/>
    <path d="M336 62V34q0-10 10-10h180q10 0 10 10v28Z" fill="var(--illo-shade-strong, #d9c3a8)"/>
    <path d="M358 14v18M514 14v18" stroke-width="4"/>
    <g fill="var(--illo-ink, #3b0d1a)" stroke="none" text-anchor="middle">
      <text x="436" y="51" font-size="18" font-weight="700" letter-spacing="2">ANY FRIDAY</text>
      <text x="436" y="118" font-size="44" font-weight="700">?</text>
      <text x="436" y="156" font-size="19">her birthday</text>
    </g>
  </g>
  <g fill="var(--illo-ink, #3b0d1a)" stroke="none" text-anchor="middle">
    <text x="280" y="222" font-size="20">Same heist, same reunion.</text>
    <text x="280" y="248" font-size="20" font-weight="700">PRO's own test now fails.</text>
  </g>
</svg>
