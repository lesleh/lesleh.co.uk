<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 230" width="100%" role="img" aria-label="Bar chart of the average time lost per commit, if the slow checks fail on 1 commit in 4 and each failure costs 10 minutes. With the hook, 1 minute, because every commit waits. Without the hook, 2.5 minutes, a quarter of 10 minutes." fill="none" stroke="var(--illo-ink, #3b0d1a)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:2rem auto;padding:3%;box-sizing:border-box;border-radius:12px;background:var(--illo-paper, #fbf1e4);max-width:34rem">
<path d="M214 100V214" stroke-width="1" stroke-opacity=".6"/>
  <g fill="var(--illo-ink, #3b0d1a)" stroke="none">
    <path fill="var(--illo-accent, #af1440)" d="M214 112H298q4 0 4 4v16q0 4-4 4H214Z"/>
    <text x="312" y="130" font-size="18" font-weight="700">1 min</text>
    <path fill="var(--illo-accent, #af1440)" d="M214 176H430q4 0 4 4v16q0 4-4 4H214Z"/>
    <text x="444" y="194" font-size="18" font-weight="700">2.5 min</text>
    <text x="10" y="30" font-size="21" font-weight="700">Average time lost per commit</text>
    <text x="10" y="56" font-size="17">if the slow checks fail on 1 commit in 4,</text>
    <text x="10" y="78" font-size="17">and each failure costs 10 minutes</text>
    <g text-anchor="end">
      <text x="200" y="122" font-size="18">With the hook</text>
      <text x="200" y="143" font-size="17">every commit waits</text>
      <text x="200" y="186" font-size="18">Without the hook</text>
      <text x="200" y="207" font-size="17">a quarter of 10 minutes</text>
    </g>
  </g>
</svg>
