<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 560 640" width="100%" role="img" aria-label="How one eval case runs. scaffold.sh builds a tiny git repo, if the case has one. prompt.md holds the slash command and the pitch, and the appended system prompt answers for the user. One run of dragons-den asks its questions and answers them. It leaves a JSONL trace and a scope doc in plans/. The graders check them: regex and llm graders read the trace, and file_exists looks for the doc. Each case runs 3 times, and each run passes or fails." fill="none" stroke="var(--illo-ink, #3b0d1a)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:block;margin:2rem auto;padding:3%;box-sizing:border-box;border-radius:12px;background:var(--illo-paper, #fbf1e4);max-width:34rem">
